name: Refresh giveaways

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python sync_giveaways.py

      - name: Commit refreshed data
        run: |
          git config user.name "giveaway-sync"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh giveaway data"
            git push
          fi
