<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Giveaway Tracker</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827;margin:0}.wrap{max-width:920px;margin:auto;padding:18px}.hero{background:#111827;color:#fff;border-radius:18px;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#1f2937;padding:12px;border-radius:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,button{font:inherit;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}button,a{cursor:pointer}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:12px}.pill{border:1px solid #d1d5db;border-radius:999px;padding:4px 8px;font-size:12px;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.primary{background:#111827;color:white;text-decoration:none}.actions>*{padding:10px 12px;border-radius:10px}.muted{color:#6b7280;font-size:13px}@media(max-width:600px){.stats{grid-template-columns:1fr}.row{flex-direction:column}}</style></head>
<body><main class="wrap"><section class="hero"><h1>Giveaway Tracker</h1><p>Daily sweepstakes queue with directory-fed discovery.</p><div class="stats"><div class="stat">Active<br><strong id="active">—</strong></div><div class="stat">Due today<br><strong id="due">—</strong></div><div class="stat">Entered today<br><strong id="done">—</strong></div></div></section>
<div class="controls"><input id="q" placeholder="Search…"><select id="f"><option value="all">All</option><option value="daily">Daily</option><option value="vehicle">Vehicles</option><option value="cash">Cash</option><option value="texas">Texas / limited</option><option value="top">Highest value</option></select><button id="reset">Reset today's entries</button></div><div id="list"></div><p class="muted">Last data refresh is supplied by the repository sync job. Always verify official rules before entering. The app does not auto-submit entries.</p></main>
<script>
let D=[],entered=JSON.parse(localStorage.getItem('gt:'+new Date().toISOString().slice(0,10))||'[]');const $=x=>document.getElementById(x);
fetch('data.json').then(r=>r.json()).then(d=>{D=d;render()}).catch(()=>{$('list').innerHTML='<div class="card">Could not load giveaway data.</div>'});
function render(){let now=new Date().toISOString().slice(0,10),q=$('q').value.toLowerCase(),f=$('f').value,a=D.filter(x=>x.ends>=now&&x.name.toLowerCase().includes(q));
if(f==='daily')a=a.filter(x=>x.frequency==='daily');if(f==='vehicle')a=a.filter(x=>x.category.includes('vehicle'));if(f==='cash')a=a.filter(x=>x.category.includes('cash'));if(f==='texas')a=a.filter(x=>/texas|limited/i.test(x.eligibility));if(f==='top')a=a.sort((x,y)=>y.value-x.value).slice(0,15);
$('active').textContent=D.filter(x=>x.ends>=now).length;$('due').textContent=D.filter(x=>x.ends>=now&&x.frequency==='daily'&&!entered.includes(x.id)).length;$('done').textContent=entered.length;
$('list').innerHTML=a.map(x=>{let d=Math.ceil((new Date(x.ends+'T23:59:59')-new Date())/86400000),done=entered.includes(x.id);return `<article class="card"><div class="row"><div><h2 style="margin:0 0 4px">${x.name}</h2><div>${x.prize}</div></div><span class="pill">$${Number(x.value).toLocaleString()} ARV</span></div><div class="muted">Ends ${new Date(x.ends+'T12:00:00').toLocaleDateString()} · ${d} days · ${x.frequency} · ${x.eligibility}</div><div class="actions"><a class="primary" href="${x.url}" target="_blank" rel="noopener">Open source / official</a>${x.frequency==='daily'?`<button data-id="${x.id}">${done?'✓ Entered today':'Mark entered'}</button>`:''}</div><div class="muted">Source: ${x.source}</div></article>`}).join('')||'<div class="card">No matches.</div>';
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let id=b.dataset.id;entered=entered.includes(id)?entered.filter(v=>v!==id):[...entered,id];localStorage.setItem('gt:'+now,JSON.stringify(entered));render()})}
$('q').oninput=render;$('f').onchange=render;$('reset').onclick=()=>{entered=[];localStorage.setItem('gt:'+new Date().toISOString().slice(0,10),'[]');render()};
</script></body></html>
